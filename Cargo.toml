[package]
name = "aegis"
version = "0.1.0"
edition = "2021"
description = "AI security firewall proxy — local, fast, no cloud"
license = "Apache-2.0"
repository = "https://github.com/rijos-software/aegis"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
bytes = "1"
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["ring"] }
hyper-rustls = { version = "0.27", features = ["http1", "ring", "webpki-roots"] }
webpki-roots = "0.26"
aho-corasick = "1"
regex = "1"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
tokio-test = "0.4"
assert_cmd = "2"
predicates = "3"
tempfile = "3"
